<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #2563eb);
      padding: 20px;
    }

    .calculator {
      width: 100%;
      max-width: 380px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .title {
      text-align: center;
      color: white;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .display {
      width: 100%;
      height: 90px;
      border: none;
      outline: none;
      border-radius: 18px;
      background: rgba(0,0,0,0.35);
      color: white;
      font-size: 34px;
      text-align: right;
      padding: 15px;
      margin-bottom: 18px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 65px;
      border: none;
      border-radius: 17px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      background: rgba(255,255,255,0.15);
      color: white;
      transition: 0.15s;
    }

    button:active {
      transform: scale(0.92);
    }

    .operator {
      background: #f59e0b;
    }

    .clear {
      background: #ef4444;
    }

    .equal {
      background: #22c55e;
      grid-column: span 2;
    }

    .zero {
      grid-column: span 2;
    }

    .footer {
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="title">Smart Calculator</div>

    <input type="text" id="display" class="display" value="0" readonly>

    <div class="buttons">

      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">DEL</button>
      <button onclick="percentage()">%</button>
      <button class="operator" onclick="addOperator('/')">÷</button>

      <button onclick="addNumber('7')">7</button>
      <button onclick="addNumber('8')">8</button>
      <button onclick="addNumber('9')">9</button>
      <button class="operator" onclick="addOperator('*')">×</button>

      <button onclick="addNumber('4')">4</button>
      <button onclick="addNumber('5')">5</button>
      <button onclick="addNumber('6')">6</button>
      <button class="operator" onclick="addOperator('-')">−</button>

      <button onclick="addNumber('1')">1</button>
      <button onclick="addNumber('2')">2</button>
      <button onclick="addNumber('3')">3</button>
      <button class="operator" onclick="addOperator('+')">+</button>

      <button class="zero" onclick="addNumber('0')">0</button>
      <button onclick="addNumber('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="footer">
      Fast • Simple • Mobile Friendly
    </div>

  </div>

  <script>
    const display = document.getElementById("display");

    function addNumber(number) {
      if (display.value === "0" || display.value === "Error") {
        display.value = number;
      } else {
        display.value += number;
      }
    }

    function addOperator(operator) {
      if (display.value === "Error") {
        display.value = "0";
      }

      const last = display.value.slice(-1);

      if (["+", "-", "*", "/"].includes(last)) {
        display.value = display.value.slice(0, -1) + operator;
      } else {
        display.value += operator;
      }
    }

    function clearDisplay() {
      display.value = "0";
    }

    function deleteLast() {
      if (display.value.length <= 1 || display.value === "Error") {
        display.value = "0";
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function percentage() {
      try {
        display.value = (parseFloat(display.value) / 100).toString();
      } catch {
        display.value = "Error";
      }
    }

    function calculate() {
      try {
        const expression = display.value;

        if (!/^[0-9+\-*/.]+$/.test(expression)) {
          display.value = "Error";
          return;
        }

        const result = Function('"use strict"; return (' + expression + ')')();

        if (!Number.isFinite(result)) {
          display.value = "Error";
        } else {
          display.value = result;
        }

      } catch {
        display.value = "Error";
      }
    }
  </script>

</body>
</html>
