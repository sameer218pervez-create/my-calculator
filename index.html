```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Calculator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
min-height:100vh;
background:linear-gradient(135deg,#111827,#2563eb);
color:white;padding:20px;
}
.container{max-width:500px;margin:auto}
h1{text-align:center;margin:15px 0 20px}
.card{
background:rgba(255,255,255,.12);
padding:20px;border-radius:20px;margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25)
}
input,button,select{
width:100%;padding:14px;margin-top:10px;
border:0;border-radius:12px;font-size:16px
}
button{background:#22c55e;color:white;font-weight:bold;cursor:pointer}
.result{
margin-top:15px;padding:14px;background:rgba(0,0,0,.25);
border-radius:12px;text-align:center
}
.calculator{
display:grid;grid-template-columns:repeat(4,1fr);gap:10px
}
.display{
grid-column:span 4;background:#111827;color:white;
text-align:right;font-size:28px
}
.calculator button{margin:0;background:rgba(255,255,255,.15)}
.calculator .op{background:#f59e0b}
.calculator .clear{background:#ef4444}
.calculator .equal{background:#22c55e;grid-column:span 2}
</style>
</head>

<body>

<div class="container">

<h1>Smart Calculator</h1>

<!-- Basic Calculator -->
<div class="card">
<h2>🧮 Calculator</h2>

<input id="display" class="display" value="0" readonly>

<div class="calculator">
<button class="clear" onclick="clearCalc()">AC</button>
<button onclick="delCalc()">DEL</button>
<button onclick="percentCalc()">%</button>
<button class="op" onclick="addCalc('/')">÷</button>

<button onclick="addCalc('7')">7</button>
<button onclick="addCalc('8')">8</button>
<button onclick="addCalc('9')">9</button>
<button class="op" onclick="addCalc('*')">×</button>

<button onclick="addCalc('4')">4</button>
<button onclick="addCalc('5')">5</button>
<button onclick="addCalc('6')">6</button>
<button class="op" onclick="addCalc('-')">−</button>

<button onclick="addCalc('1')">1</button>
<button onclick="addCalc('2')">2</button>
<button onclick="addCalc('3')">3</button>
<button class="op" onclick="addCalc('+')">+</button>

<button onclick="addCalc('0')">0</button>
<button onclick="addCalc('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
</div>
</div>

<!-- Percentage -->
<div class="card">
<h2>📊 Percentage Calculator</h2>
<input id="percentNumber" type="number" placeholder="Enter number">
<input id="percentValue" type="number" placeholder="Enter percentage">
<button onclick="percentage()">Calculate</button>
<div class="result" id="percentResult">Result will appear here</div>
</div>

<!-- BMI -->
<div class="card">
<h2>⚖️ BMI Calculator</h2>
<input id="weight" type="number" placeholder="Weight in kg">
<input id="height" type="number" placeholder="Height in cm">
<button onclick="bmi()">Calculate BMI</button>
<div class="result" id="bmiResult">Result will appear here</div>
</div>

<!-- Age -->
<div class="card">
<h2>🎂 Age Calculator</h2>
<input id="birthDate" type="date">
<button onclick="age()">Calculate Age</button>
<div class="result" id="ageResult">Result will appear here</div>
</div>

</div>

<script>
const display=document.getElementById("display");

function addCalc(x){
if(display.value==="0") display.value=x;
else display.value+=x;
}

function clearCalc(){display.value="0"}

function delCalc(){
display.value=display.value.length>1?
display.value.slice(0,-1):"0";
}

function percentCalc(){
display.value=(parseFloat(display.value)/100).toString();
}

function calculate(){
try{
if(!/^[0-9+\-*/.]+$/.test(display.value)){
display.value="Error";return;
}
display.value=Function('"use strict";return('+display.value+')')();
}catch{
display.value="Error";
}
}

function percentage(){
let n=parseFloat(document.getElementById("percentNumber").value);
let p=parseFloat(document.getElementById("percentValue").value);

if(isNaN(n)||isNaN(p)){
document.getElementById("percentResult").innerText="Please enter both values";
return;
}

document.getElementById("percentResult").innerText=
p+"% of "+n+" = "+(n*p/100);
}

function bmi(){
let weight=parseFloat(document.getElementById("weight").value);
let height=parseFloat(document.getElementById("height").value);

if(isNaN(weight)||isNaN(height)||height<=0){
document.getElementById("bmiResult").innerText="Please enter valid values";
return;
}

let h=height/100;
let value=weight/(h*h);

let category="";

if(value<18.5) category="Underweight";
else if(value<25) category="Normal";
else if(value<30) category="Overweight";
else category="Obesity";

document.getElementById("bmiResult").innerText=
"BMI: "+value.toFixed(1)+" — "+category;
}

function age(){
let birth=new Date(document.getElementById("birthDate").value);
let today=new Date();

if(isNaN(birth.getTime())){
document.getElementById("ageResult").innerText="Please select your birth date";
return;
}

let years=today.getFullYear()-birth.getFullYear();
let month=today.getMonth()-birth.getMonth();

if(month<0 || (month===0 && today.getDate()<birth.getDate())){
years--;
}

document.getElementById("ageResult").innerText=
"Your age is "+years+" years";
}
</script>

</body>
</html>
```
